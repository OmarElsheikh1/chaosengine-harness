name: install-windows

on:
  push:
    branches: [main, ChaosEngine/installer-revamp]
  pull_request:

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Offline installer tests
        shell: pwsh
        run: |
          $gitBash = "C:\Program Files\Git\bin"
          if (-not (Test-Path -LiteralPath "$gitBash\bash.exe")) {
            throw "Git Bash is required. System32 bash is the WSL stub and writes a UTF-16 install message."
          }
          $env:PATH = "$gitBash;" + $env:PATH
          python -m pytest -q -p no:cacheprovider tests/installer
        env:
          CHAOS_ENGINE_SKIP_TOOLS: "1"

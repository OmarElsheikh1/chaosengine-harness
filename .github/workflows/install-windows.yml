name: install-windows

on:
  push:
    branches: [main, ChaosEngine/installer-revamp]
  pull_request:

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Offline installer tests
        run: python -m pytest -q -p no:cacheprovider tests/installer
        env:
          CHAOS_ENGINE_SKIP_TOOLS: "1"

name: install-macos

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  installer:
    if: contains(github.event.pull_request.labels.*.name, 'ci:installer-macos')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Offline installer tests
        run: python -m pytest -q -p no:cacheprovider tests/installer
        env:
          CHAOS_ENGINE_SKIP_TOOLS: "1"

name: ChaosEngine installer
description: Report a failed ChaosEngine installation with the fields the installer prefills.
title: "[ChaosEngine installer] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        The ChaosEngine installer fills every field, including the redacted
        install trace, console log, and doctor JSON. Click Submit.
        Nothing else needs to be pasted or attached. Local copies also stay in
        `.chaos-engine-state/` (`install-trace.json`, `install-console.log`,
        `doctor-failure.json`).
  - type: input
    id: error_code
    attributes:
      label: Error code
      placeholder: CE-INSTALL-FAILED
    validations:
      required: true
  - type: textarea
    id: cause
    attributes:
      label: Cause
    validations:
      required: true
  - type: input
    id: failed_phase
    attributes:
      label: Failed phase
    validations:
      required: true
  - type: input
    id: unhealthy
    attributes:
      label: Unhealthy components
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Python sys.platform (win32, linux, darwin).
    validations:
      required: true
  - type: input
    id: os_name
    attributes:
      label: OS name
      description: Windows, Linux, Darwin, or equivalent.
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS version
    validations:
      required: true
  - type: input
    id: architecture
    attributes:
      label: Architecture
      description: AMD64, arm64, x86_64, and similar.
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python version
    validations:
      required: true
  - type: input
    id: machine
    attributes:
      label: Machine
      description: Terse platform string (no hostname or home path).
    validations:
      required: true
  - type: input
    id: doctor_details
    attributes:
      label: Doctor details
      description: Bounded component:code pairs from doctor-failure.json.
    validations:
      required: true
  - type: input
    id: hosts_receipt
    attributes:
      label: Hosts receipt
      description: present/absent for `.chaos-engine-hosts.json`
    validations:
      required: true
  - type: input
    id: core_dir
    attributes:
      label: Core dir
      description: present/absent for `.chaos-engine/`
    validations:
      required: true
  - type: input
    id: install_py
    attributes:
      label: install.py
      description: present/absent for `.chaos-engine/install.py`
    validations:
      required: true
  - type: input
    id: install_trace
    attributes:
      label: Install trace (repo-relative)
      description: Use `.chaos-engine-state/install-trace.json`. A private absolute path is not useful.
    validations:
      required: true
  - type: textarea
    id: install_trace_snippet
    attributes:
      label: Install trace
      description: Redacted install-trace.json. Already filled by the installer.
  - type: textarea
    id: console_log
    attributes:
      label: Full console log
      description: Redacted install-console.log. Already filled by the installer.
  - type: textarea
    id: doctor_json
    attributes:
      label: Full doctor JSON
      description: Redacted doctor-failure.json. Already filled by the installer.
  - type: input
    id: status_command
    attributes:
      label: Status command
    validations:
      required: true
  - type: input
    id: doctor_command
    attributes:
      label: Doctor command
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Terminal emulator, whether Java/Node were already installed, and anything else maintainers should know.
